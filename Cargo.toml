[workspace]
members = [
    "crates/kendr-optimizer-contracts",
    "crates/kendr-optimizer-core",
    "crates/kendr-optimizer-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/Kendr-AI/Kendr-Optimizer"
authors = ["Kendr Optimizer contributors"]

[workspace.dependencies]
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
once_cell = "1.21.4"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.19"
tiktoken-rs = "0.12.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "io-std"] }
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
