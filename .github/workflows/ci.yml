name: ci

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-metadata:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Require release commit on main
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: Check release tag and metadata
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          release_date="$(sed -n 's/^date-released: //p' CITATION.cff | head -n 1)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          [[ "${release_date}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          grep -Fqx "## [${version}] - ${release_date}" CHANGELOG.md
          grep -Fqx "version: ${version}" CITATION.cff
          grep -Fqx "date-released: ${release_date}" CITATION.cff

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test repository hygiene checker
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Check release and installer syntax
        run: |
          python3 -m py_compile scripts/build_third_party_licenses.py scripts/cli_release.py scripts/smoke_installer.py
          shellcheck --shell=sh install/kendr-opt-installer.sh
      - name: Analyze PowerShell installer
        shell: pwsh
        run: |
          $findings = @(Invoke-ScriptAnalyzer `
            -Path install/kendr-opt-installer.ps1 `
            -Severity Warning,Error)
          if ($findings.Count) {
            $findings | Format-Table -AutoSize
            exit 1
          }
      - name: Check repository hygiene
        run: python3 scripts/check_repository_hygiene.py
      - name: Check third-party license bundle freshness
        run: python3 scripts/build_third_party_licenses.py --check

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked

  evidence-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Test release hardening
        run: python -m unittest discover -s benchmarks/runners/tests -p 'test_*.py'
      - name: Verify canonical benchmark release
        run: python benchmarks/runners/verify_release.py --release releases/v0.1.0-benchmark.5 --require-complete-attempts
      - name: Verify derived rankings
        run: python benchmarks/runners/rank_release.py --release releases/v0.1.0-benchmark.5 --output benchmarks/rankings/v0.1.0-benchmark.5 --check
      - name: Build whitepaper from authoritative Markdown
        run: |
          python -m pip install -r scripts/requirements-docs.txt
          python scripts/build_whitepaper.py --output "${{ runner.temp }}/kendr-optimizer-whitepaper.pdf"
      - name: Verify committed whitepaper source identity
        run: python scripts/check_whitepaper_pdf.py

  node-adapters:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter:
          - claude-channels
          - claude-code
          - openclaw
          - opencode
          - pi-agent
    defaults:
      run:
        working-directory: integrations/${{ matrix.adapter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: integrations/${{ matrix.adapter }}/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Verify package legal files
        run: |
          npm pack --dry-run --json > "${RUNNER_TEMP}/npm-pack.json"
          node -e "const p=require(process.env.RUNNER_TEMP + '/npm-pack.json')[0]; const f=new Set(p.files.map(x=>x.path)); for (const n of ['LICENSE','NOTICE']) if (!f.has(n)) throw new Error('missing '+n)"
      - name: Pack GitHub Release adapter
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p "${RUNNER_TEMP}/adapter"
          npm pack --pack-destination "${RUNNER_TEMP}/adapter"
      - name: Upload GitHub Release adapter
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: adapter-${{ matrix.adapter }}
          path: ${{ runner.temp }}/adapter/*.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  hermes-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check out audited Hermes Agent source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: NousResearch/hermes-agent
          ref: 3c27eb6234bf91b8ceee9e9071591b31e9b148cb
          path: .upstream/hermes-agent
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Run adapter and pinned upstream-contract tests
        env:
          HERMES_AGENT_SOURCE: ${{ github.workspace }}/.upstream/hermes-agent
        run: |
          python -m pip install PyYAML==6.0.3
          python -m unittest discover -s integrations/hermes-agent/tests -v
      - name: Verify wheel legal files
        run: |
          python -m pip wheel --no-deps --wheel-dir "${RUNNER_TEMP}/wheels" integrations/hermes-agent
          python -c "import glob,zipfile; p=glob.glob('${{ runner.temp }}/wheels/*.whl')[0]; n=zipfile.ZipFile(p).namelist(); assert any(x.endswith('/licenses/LICENSE') for x in n); assert any(x.endswith('/licenses/NOTICE') for x in n)"
      - name: Upload GitHub Release adapter
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: adapter-hermes-agent
          path: ${{ runner.temp }}/wheels/*.whl
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  nanoclaw-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check out audited NanoClaw source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nanocoai/nanoclaw
          ref: 743e32df4e6c05f3725c17cb2ec11f2b65079eec
          path: .upstream/nanoclaw
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12
      - name: Install and verify the guarded source integration
        run: |
          node integrations/nanoclaw/skill/assets/apply-patch.mjs --check-source .upstream/nanoclaw
          cp integrations/nanoclaw/skill/assets/kendr-optimizer.ts .upstream/nanoclaw/container/agent-runner/src/kendr-optimizer.ts
          cp integrations/nanoclaw/skill/assets/kendr-optimizer.test.ts .upstream/nanoclaw/container/agent-runner/src/kendr-optimizer.test.ts
          node integrations/nanoclaw/skill/assets/apply-patch.mjs .upstream/nanoclaw
          node integrations/nanoclaw/skill/assets/apply-patch.mjs .upstream/nanoclaw
          node integrations/nanoclaw/skill/assets/apply-patch.mjs --check .upstream/nanoclaw
          (cd .upstream/nanoclaw/container/agent-runner && bun test src/kendr-optimizer.test.ts)
          node integrations/nanoclaw/skill/assets/apply-patch.mjs --remove .upstream/nanoclaw
          node integrations/nanoclaw/skill/assets/apply-patch.mjs --check-source .upstream/nanoclaw

  release-archives:
    name: CLI archive (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            binary: kendr-opt
            archive: kendr-opt-x86_64-unknown-linux-musl.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary: kendr-opt
            archive: kendr-opt-aarch64-unknown-linux-musl.tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: kendr-opt
            archive: kendr-opt-x86_64-apple-darwin.tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            binary: kendr-opt
            archive: kendr-opt-aarch64-apple-darwin.tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: kendr-opt.exe
            archive: kendr-opt-x86_64-pc-windows-msvc.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install MUSL build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils musl-tools
      - name: Configure release build
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          echo "RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "${GITHUB_ENV}"
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl)
              echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "${GITHUB_ENV}"
              ;;
            aarch64-unknown-linux-musl)
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "${GITHUB_ENV}"
              ;;
            x86_64-pc-windows-msvc)
              echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS=-C target-feature=+crt-static" >> "${GITHUB_ENV}"
              ;;
            *-apple-darwin)
              echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "${GITHUB_ENV}"
              ;;
          esac
      - name: Build release binary
        shell: bash
        run: cargo build --release --locked --package kendr-optimizer-cli --target "${{ matrix.target }}"
      - name: Verify static Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          if readelf -l "${binary}" | grep -q 'INTERP'; then
            echo "::error::Linux release executable is dynamically linked"
            exit 1
          fi
      - name: Smoke-test and package release binary
        shell: bash
        run: |
          python scripts/cli_release.py package \
            --binary "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            --target "${{ matrix.target }}" \
            --version "${RELEASE_VERSION}" \
            --output-dir dist
      - name: Exercise native installer and failed-upgrade rollback
        shell: bash
        run: |
          python scripts/smoke_installer.py \
            --archive "dist/${{ matrix.archive }}" \
            --target "${{ matrix.target }}" \
            --version "${RELEASE_VERSION}"
      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-${{ matrix.target }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish-release:
    name: Publish GitHub prerelease
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - release-metadata
      - hygiene
      - rust
      - evidence-and-docs
      - node-adapters
      - hermes-adapter
      - nanoclaw-adapter
      - release-archives
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Download native archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Download adapter packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: adapter-*
          path: dist
          merge-multiple: true
      - name: Assemble and verify release assets
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python scripts/cli_release.py assemble --directory dist --version "${version}"
      - name: Create verified draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --fail-on-no-commits \
            --draft \
            --prerelease \
            --latest=false \
            --title "Kendr Optimizer ${GITHUB_REF_NAME} (pre-alpha)" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
      - name: Verify uploaded asset digests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          verified=0
          for attempt in 1 2 3 4 5; do
            gh release view "${GITHUB_REF_NAME}" \
              --json assets,isDraft,isPrerelease,tagName \
              > "${RUNNER_TEMP}/release.json"
            if python scripts/cli_release.py verify-github-assets \
              --directory dist \
              --release-json "${RUNNER_TEMP}/release.json"; then
              verified=1
              break
            fi
            sleep 2
          done
          test "${verified}" -eq 1
          python - "${RUNNER_TEMP}/release.json" "${GITHUB_REF_NAME}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              release = json.load(stream)
          assert release["tagName"] == sys.argv[2]
          assert release["isDraft"] is True
          assert release["isPrerelease"] is True
          PY
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release edit "${GITHUB_REF_NAME}" --draft=false --prerelease --latest=false
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            > "${RUNNER_TEMP}/published-release.json"
          python scripts/cli_release.py verify-github-assets \
            --directory dist \
            --release-json "${RUNNER_TEMP}/published-release.json"
          python - "${RUNNER_TEMP}/published-release.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              release = json.load(stream)
          assert release["draft"] is False
          assert release["prerelease"] is True
          assert release["published_at"] is not None
          PY
