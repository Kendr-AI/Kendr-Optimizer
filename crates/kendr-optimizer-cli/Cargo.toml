[package]
name = "kendr-optimizer-cli"
description = "CLI and local transform-only service for Kendr Optimizer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
readme.workspace = true
repository.workspace = true
documentation = "https://docs.rs/kendr-optimizer-cli"
keywords = ["llm", "tokens", "optimization", "prompt", "cli"]
categories = ["command-line-utilities", "web-programming::http-server"]

[[bin]]
name = "kendr-opt"
path = "src/main.rs"

[dependencies]
axum.workspace = true
clap.workspace = true
kendr-optimizer-contracts = { version = "0.1.2", path = "../kendr-optimizer-contracts" }
kendr-optimizer-core = { version = "0.1.2", path = "../kendr-optimizer-core" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
