[workspace]
members = [
    "crates/kendr-optimizer-contracts",
    "crates/kendr-optimizer-core",
    "crates/kendr-optimizer-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.88"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/Kendr-AI/Kendr-Optimizer"
authors = ["Kendr Optimizer contributors"]

[workspace.dependencies]
anstream = "1.0.0"
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = { version = "0.29.0", default-features = false, features = ["events", "windows"] }
flate2 = "1.1.9"
fs2 = "0.4.3"
once_cell = "1.21.4"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
self-replace = "1.5.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.19"
tiktoken-rs = "0.12.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "io-std", "time"] }
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
zip = { version = "6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
